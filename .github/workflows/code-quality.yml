name: Code Quality Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

# Keep in sync with ci.yml — pnpm 11+ needs Node >= 22.13 (node:sqlite).
env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"

jobs:
  quality-check:
    name: Code Quality & Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      checks: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史,用于更好的 diff 分析
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      # 1. TypeScript 类型检查
      - name: Type Check
        run: pnpm type-check
      
      # 2. ESLint 检查 (基础版)
      - name: ESLint Check
        run: pnpm lint
      
      # 3. Prettier 格式检查
      - name: Format Check
        run: pnpm format:check
      
      # 4. 运行单元测试 (跳过 - 无测试文件)
      # - name: Run Unit Tests
      #   run: pnpm test:unit
      
      # 5. Reviewdog - ESLint (自动在 PR 上评论问题)
      - name: Run Reviewdog (ESLint)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          eslint_flags: '.'
          fail_on_error: false
          filter_mode: added
          level: warning
      
      # 6. Reviewdog - TypeScript (自动在 PR 上评论类型错误)
      - name: Run Reviewdog (TypeScript)
        if: github.event_name == 'pull_request'
        uses: EPMatt/reviewdog-action-tsc@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          tsc_flags: '--noEmit'
          fail_on_error: false
          filter_mode: added
          level: error
      
      # 7. Reviewdog - Prettier (自动在 PR 上评论格式问题)
      - name: Run Reviewdog (Prettier)
        if: github.event_name == 'pull_request'
        uses: EPMatt/reviewdog-action-prettier@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          prettier_flags: '--check'
          fail_on_error: false
          filter_mode: added
          level: warning
      
      # 8. 构建验证
      - name: Build Check
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CI: true
      
      # 9. 生成代码质量报告
      - name: Generate Quality Report
        if: always()
        run: |
          echo "## 📊 代码质量报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ 检查项目" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript 类型检查" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint 代码规范" >> $GITHUB_STEP_SUMMARY
          echo "- Prettier 格式检查" >> $GITHUB_STEP_SUMMARY
          echo "- 单元测试" >> $GITHUB_STEP_SUMMARY
          echo "- 构建验证" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 详细结果请查看上方各步骤" >> $GITHUB_STEP_SUMMARY
